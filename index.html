<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mammans Träningspass</title>
    <!-- Laddar in konfetti-verktyget -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body { 
            font-family: sans-serif; 
            background-color: #121212; 
            color: #ffffff; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px 0;
            box-sizing: border-box;
            transition: background-color 1.5s ease; /* Mjuk övergång för bakgrundsfärg */
        }
        .container { 
            text-align: center; 
            max-width: 600px; 
            width: 90%;
            padding: 25px; 
            background: rgba(30, 30, 30, 0.95); 
            border-radius: 16px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.6); 
        }

        /* Meny för val av pass */
        #menu-screen {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .workout-option-btn {
            background-color: #2c3e50;
            color: #ffffff;
            font-size: 1.3rem;
            padding: 20px;
            border-radius: 12px;
            border: 2px solid #4caf50;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
        }
        .workout-option-btn:hover {
            background-color: #3e5871;
            transform: translateY(-2px);
        }

        /* Huvudvy för träning */
        #workout-screen, #history-screen {
            display: none;
        }

        /* Framstegsmätaren */
        #progress-container {
            width: 100%;
            height: 12px;
            background-color: #333;
            border-radius: 6px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        #progress-bar {
            width: 0%;
            height: 100%;
            background-color: #4caf50;
            transition: width 0.5s ease-out;
        }
        h1 { font-size: 2.2rem; margin-bottom: 10px; color: #4caf50; }
        #timer { font-size: 4.5rem; font-weight: bold; margin: 15px 0; font-variant-numeric: tabular-nums; }
        #description { font-size: 1.1rem; color: #dddddd; min-height: 60px; margin-bottom: 20px; line-height: 1.4; }
        #up-next { font-size: 1.1rem; color: #ff9800; margin-bottom: 25px; font-weight: bold; }
        
        .btn-group {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        button { font-size: 1.1rem; padding: 14px 24px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        #start-btn { background-color: #4caf50; color: white; min-width: 120px; }
        #next-btn { background-color: #2196f3; color: white; }
        #change-workout-btn, #history-btn { background-color: #555; color: white; font-size: 0.95rem; padding: 12px 18px; margin-top: 15px; }
        button:active { transform: scale(0.95); }

        /* Loggningsruta vid avslutat pass */
        #log-summary {
            display: none;
            background: #252525;
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
            border: 1px solid #4caf50;
            text-align: left;
        }
        #log-summary h3 { color: #4caf50; margin-top: 0; }
        #log-date { font-weight: bold; color: #ff9800; margin-bottom: 10px; }
        textarea {
            width: 100%;
            height: 90px;
            background: #181818;
            color: #fff;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 10px;
            box-sizing: border-box;
            font-family: sans-serif;
            font-size: 1rem;
            resize: vertical;
            margin-bottom: 12px;
        }
        #save-log-btn {
            background-color: #4caf50;
            color: white;
            width: 100%;
        }

        /* Historik-lista */
        .history-list {
            text-align: left;
            max-height: 350px;
            overflow-y: auto;
            margin-bottom: 20px;
        }
        .history-item {
            background: #222;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 12px;
            border-left: 4px solid #4caf50;
        }
        .history-date { font-size: 0.85rem; color: #aaa; margin-bottom: 4px; }
        .history-title { font-size: 1.1rem; font-weight: bold; color: #4caf50; margin-bottom: 6px; }
        .history-comment { font-size: 0.95rem; color: #ddd; white-space: pre-wrap; }
    </style>
</head>
<body>

<div class="container">
    <!-- SKÄRM 1: VAL AV TRÄNINGSPASS -->
    <div id="menu-screen">
        <h1>Välj dagens pass 💪</h1>
        <p style="color: #bbb; margin-bottom: 20px;">Välj vilket träningspass du vill köra idag:</p>
        <button class="workout-option-btn" onclick="selectWorkout('main')">
            🏋️‍♀️ Huvudpass (Rehab & Styrka Fas 2)
            <div style="font-size: 0.9rem; color: #aaa; margin-top: 5px;">Ca 47 minuter</div>
        </button>
        <button class="workout-option-btn" onclick="selectWorkout('short')" style="border-color: #ff9800;">
            ⚡ Kort träningspass
            <div style="font-size: 0.9rem; color: #aaa; margin-top: 5px;">Ett snabbare alternativ</div>
        </button>
        
        <div>
            <button id="history-btn" onclick="showHistory()">📜 Se träningsdagbok / historik</button>
        </div>
    </div>

    <!-- SKÄRM 2: SJÄLVA TRÄNINGSPASSET -->
    <div id="workout-screen">
        <div id="progress-container"><div id="progress-bar"></div></div>
        <h1 id="exercise-name">Gör dig redo!</h1>
        <div id="description">Tryck på start när du är redo att börja passet.</div>
        <div id="timer">00:00</div>
        <div id="up-next">Nästa: -</div>
        
        <div class="btn-group" id="controls-group">
            <button id="start-btn" onclick="toggleTimer()">Start</button>
            <button id="next-btn" onclick="nextStep()">Nästa ➔</button>
        </div>

        <!-- LOGGNINGSRUTA NÄR PASSET ÄR KLART -->
        <div id="log-summary">
            <h3>📝 Spara träningspass</h3>
            <div id="log-date"></div>
            <label style="font-size: 0.9rem; color: #ccc; display: block; margin-bottom: 5px;">Kommentar (känsla, reps, vikter):</label>
            <textarea id="log-comment" placeholder="Hur kändes passet? Ökade du i någon övning? (t.ex. Knäböj 10kg, kändes bra i knät)"></textarea>
            <button id="save-log-btn" onclick="saveWorkoutLog()">💾 Spara i träningsdagboken</button>
        </div>

        <div>
            <button id="change-workout-btn" onclick="showMenu()">↩ Byt pass</button>
        </div>
    </div>

    <!-- SKÄRM 3: TRÄNINGSHISTORIK -->
    <div id="history-screen">
        <h1>Träningsdagbok 📜</h1>
        <div class="history-list" id="history-container">
            <!-- Här hamnar sparade pass -->
        </div>
        <button onclick="showMenu()" style="background-color: #2196f3; color: white;">↩ Tillbaka till menyn</button>
    </div>
</div>

    function initAudio() {
        try {
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (AudioContextClass) {
                    audioCtx = new AudioContextClass();
                }
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        } catch (e) {
            console.log("Audio exception:", e);
        }
    }

function speakExercise(text) {
    if (isMuted) return;
    
    if ('speechSynthesis' in window) {
        try {
            window.speechSynthesis.cancel();
            if (window.speechSynthesis.paused) {
                window.speechSynthesis.resume();
            }
            
            const cleanText = text.replace(/\(.*?\)/g, '').trim(); 
            const utterance = new SpeechSynthesisUtterance(cleanText);
            
            utterance.lang = 'sv-SE';
            utterance.rate = 0.95; // Drar ner hastigheten marginellt för att låta mer avslappnad och mänsklig
            utterance.pitch = 1.0;

            // Hämta alla tillgängliga röster på enheten
            const voices = window.speechSynthesis.getVoices();
            
            // Leta efter svenska röster
            const swedishVoices = voices.filter(v => v.lang === 'sv-SE' || v.lang === 'sv_SE');
            
            if (swedishVoices.length > 0) {
                // Försök hitta premium- eller förbättrade röster (Låter ofta mer mänskliga)
                const premiumVoice = swedishVoices.find(v => v.name.includes('Premium') || v.name.includes('Enhanced') || v.name.includes('Google'));
                
                if (premiumVoice) {
                    utterance.voice = premiumVoice;
                } else {
                    utterance.voice = swedishVoices[0]; // Välj den första bästa svenska rösten
                }
            }

            window.speechSynthesis.speak(utterance);
        } catch (e) {
            console.log("Speech synthesis error:", e);
        }
    }
}

// Ladda rösterna i bakgrunden direkt när appen startar (viktigt för att de ska finnas tillgängliga vid första klicket)
if ('speechSynthesis' in window) {
    window.speechSynthesis.onvoiceschanged = function() {
        window.speechSynthesis.getVoices();
    };
}

    function selectWorkout(type) {
        initAudio();
        if (type === 'short') {
            activeWorkout = shortWorkoutProgram;
            activeWorkoutTitle = "Kort Återhämtningspass";
        } else {
            activeWorkout = mainWorkoutProgram;
            activeWorkoutTitle = "Huvudpass (Rehab Fas 2)";
        }
        currentStep = 0;
        isRunning = false;
        
        if (logSummary) logSummary.style.display = "none";
        if (controlsGroup) controlsGroup.style.display = "flex";
        if (logCommentEl) logCommentEl.value = "";
        
        if (menuScreen) menuScreen.style.display = "none";
        if (historyScreen) historyScreen.style.display = "none";
        if (workoutScreen) workoutScreen.style.display = "block";
        
        updateUI(true);
    }

    function showMenu() {
        if (timerInterval) clearInterval(timerInterval);
        isRunning = false;
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        
        if (startBtn) {
            startBtn.textContent = "Start";
            startBtn.style.backgroundColor = "#4caf50";
        }

        // Återställ vyerna ordentligt
        if (logSummary) logSummary.style.display = "none";
        if (controlsGroup) controlsGroup.style.display = "flex";
        if (workoutScreen) workoutScreen.style.display = "none";
        if (historyScreen) historyScreen.style.display = "none";
        if (menuScreen) menuScreen.style.display = "flex";
    }

    function playWarningPling() {
        if (!audioCtx) return;
        try {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine'; 
            osc.frequency.setValueAtTime(700, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        } catch (e) {}
    }

    function playSuccessSound() {
        if (!audioCtx) return;
        try {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.value = freq;
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now + i * 0.1);
                gain.gain.setValueAtTime(0.3, now + i * 0.1);
                gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.1 + 0.4);
                osc.stop(now + i * 0.1 + 0.4);
            });
        } catch (e) {}
    }

    function fireConfetti(isEnd = false) {
        if (typeof confetti === 'function') {
            if (isEnd) {
                let duration = 5 * 1000;
                let end = Date.now() + duration;
                (function frame() {
                    confetti({ particleCount: 7, angle: 60, spread: 55, origin: { x: 0 } });
                    confetti({ particleCount: 7, angle: 120, spread: 55, origin: { x: 1 } });
                    if (Date.now() < end) requestAnimationFrame(frame);
                }());
            } else {
                confetti({ particleCount: 50, spread: 70, origin: { y: 0.6 } });
            }
        }
    }

    function updateBackground() {
        const randomColor = backgroundColors[Math.floor(Math.random() * backgroundColors.length)];
        document.body.style.backgroundColor = randomColor;
    }

    function updateUI(shouldSpeak = false) {
        let progressPercent = ((currentStep) / activeWorkout.length) * 100;
        if (progressPercent > 100) progressPercent = 100;
        if (progressBar) progressBar.style.width = progressPercent + "%";

        if (currentStep >= activeWorkout.length) {
            if (nameEl) nameEl.textContent = "Passet är klart! 🎉";
            if (descEl) descEl.textContent = "Otroligt bra jobbat!";
            if (timerEl) timerEl.textContent = "00:00";
            if (nextEl) nextEl.textContent = "";
            speakExercise("Passet är klart, otroligt bra jobbat!");
            showLogForm();
            return;
        }

        const step = activeWorkout[currentStep];
        if (nameEl) nameEl.textContent = step.name;
        if (descEl) descEl.textContent = step.desc;
        
        if (nextEl) {
            if (currentStep + 1 < activeWorkout.length) {
                nextEl.textContent = "Nästa: " + activeWorkout[currentStep + 1].name;
            } else {
                nextEl.textContent = "Nästa: Passet är slut!";
            }
        }

        if (!isRunning) {
            timeLeft = step.duration;
        }
        formatTime(timeLeft);

        if (shouldSpeak) {
            speakExercise(step.name);
        }
    }

    function formatTime(seconds) {
        const m = Math.floor(seconds / 60).toString().padStart(2, '0');
        const s = (seconds % 60).toString().padStart(2, '0');
        if (timerEl) timerEl.textContent = `${m}:${s}`;
    }

    function toggleTimer() {
        if (currentStep >= activeWorkout.length) return;
        initAudio();

        if (isRunning) {
            if (timerInterval) clearInterval(timerInterval);
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            if (startBtn) {
                startBtn.textContent = "Start";
                startBtn.style.backgroundColor = "#4caf50";
            }
        } else {
            if (timeLeft <= 0) timeLeft = activeWorkout[currentStep].duration;
            timerInterval = setInterval(() => {
                timeLeft--;
                formatTime(timeLeft);
                
                if (timeLeft === 3) playWarningPling();
                
                if (timeLeft <= 0) {
                    currentStep++;
                    playSuccessSound();
                    updateBackground();
                    
                    if (currentStep >= activeWorkout.length) {
                        clearInterval(timerInterval);
                        isRunning = false;
                        if (startBtn) startBtn.textContent = "Start";
                        updateUI(true);
                        fireConfetti(true);
                    } else {
                        timeLeft = activeWorkout[currentStep].duration;
                        updateUI(true);
                        fireConfetti(false);
                    }
                }
            }, 1000);
            if (startBtn) {
                startBtn.textContent = "Paus";
                startBtn.style.backgroundColor = "#f44336";
            }
        }
        isRunning = !isRunning;
    }

    function nextStep() {
        if (currentStep >= activeWorkout.length) return;
        if (timerInterval) clearInterval(timerInterval);
        isRunning = false;
        if (startBtn) {
            startBtn.textContent = "Start";
            startBtn.style.backgroundColor = "#4caf50";
        }
        
        playSuccessSound();
        fireConfetti(false);
        
        currentStep++;
        updateBackground();
        updateUI(true);
        
        if (currentStep >= activeWorkout.length) {
            fireConfetti(true);
        }
    }

    function showLogForm() {
        if (controlsGroup) controlsGroup.style.display = "none";
        if (logSummary) logSummary.style.display = "block";
        
        const now = new Date();
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' };
        completedDateTimeStr = now.toLocaleDateString('sv-SE', options);
        
        if (logDateEl) logDateEl.textContent = "📅 Datum & Tid: " + completedDateTimeStr;
    }

    function saveWorkoutLog() {
        const commentText = (logCommentEl ? logCommentEl.value.trim() : "") || "Passet genomfört utan kommentarer.";
        
        const logEntry = {
            id: Date.now(),
            dateStr: completedDateTimeStr,
            timestamp: Date.now(),
            title: activeWorkoutTitle,
            comment: commentText
        };

        let logs = JSON.parse(localStorage.getItem("workout_logs") || "[]");
        logs.push(logEntry);
        localStorage.setItem("workout_logs", JSON.stringify(logs));

        alert("Ditt träningspass har sparats i dagboken! 💪");
        showHistory();
    }

    function showHistory() {
        if (timerInterval) clearInterval(timerInterval);
        isRunning = false;
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        
        if (menuScreen) menuScreen.style.display = "none";
        if (workoutScreen) workoutScreen.style.display = "none";
        if (historyScreen) historyScreen.style.display = "block";

        let logs = JSON.parse(localStorage.getItem("workout_logs") || "[]");
        logs.sort((a, b) => b.timestamp - a.timestamp);

        if (historyContainer) {
            historyContainer.innerHTML = "";

            if (logs.length === 0) {
                historyContainer.innerHTML = "<p style='color: #aaa; text-align: center;'>Inga sparade pass ännu. Kör ett pass och spara det så syns det här!</p>";
                return;
            }

            logs.forEach(log => {
                const item = document.createElement("div");
                item.className = "history-item";
                item.innerHTML = `
                    <div class="history-date">📅 ${log.dateStr}</div>
                    <div class="history-title">🏋️‍♀️ ${log.title}</div>
                    <div class="history-comment">${escapeHtml(log.comment)}</div>
                `;
                historyContainer.appendChild(item);
            });
        }
    }

    function escapeHtml(text) {
        return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    // Initiera appen korrekt vid laddning
    showMenu();
</script>
